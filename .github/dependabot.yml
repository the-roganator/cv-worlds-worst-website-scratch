# Weekly dependency updates, each as a pull request through the same checks as any other change.
# The cooldown waits a few days after a release before proposing it: most malicious releases are pulled within hours.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's own types follow the Node version in mise.toml, which moves by hand.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # 2.1.15 was published without provenance (2.1.14 and 2.1.16 have it), so pnpm's trust policy refuses it and
      # fails the whole update. Remove once lefthook 2.1.16 or later is merged.
      - dependency-name: lefthook
        versions: ['2.1.15']
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      opentelemetry:
        patterns: ['@opentelemetry/*']
      tooling:
        dependency-type: development

  # Includes the commit at which Software Factory's shared workflows are called.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      # Software Factory's workflows are called at a commit of its main, which is minutes old when it should be taken:
      # the factory's own gates are what it waited for.
      exclude: ['the-roganator/cv-software-factory-scratch/*']
    commit-message:
      prefix: ci
    groups:
      # Software Factory's workflows, which move together to one commit of its main: a pull request of their own, apart
      # from every other action's.
      factory:
        patterns: ['the-roganator/cv-software-factory-scratch/*']
      actions:
        patterns: ['*']
        exclude-patterns: ['the-roganator/cv-software-factory-scratch/*']

  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
      # Syft, which build.yml attests SBOMs with, by version and digest (deploy/images/syft/Dockerfile). GHCR gives its
      # image no release date, so the cooldown holds for it only once GHCR does.
      - /deploy/images/syft
    schedule:
      interval: weekly
    ignore:
      # Both stages' Node match mise.toml's (test/node-pins.test.ts, and check.yml runs each), so a bump of either moves the
      # other, mise.toml and mise.lock by hand in the same pull request. A new major is a decision, not a weekly bump.
      - dependency-name: node
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

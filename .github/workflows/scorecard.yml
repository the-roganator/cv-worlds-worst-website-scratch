# OpenSSF Scorecard: an outside measure of the repository's supply-chain hygiene, published to scorecard.dev.
#
# The analysis lives in Software Factory's repository and is called at a pinned commit.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 6 * * 1'
  branch_protection_rule:

permissions: {}

jobs:
  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results
    uses: the-roganator/cv-software-factory-scratch/.github/workflows/scorecard.yml@67f8e6a3c8bbf6374227243963eb9566b83efb02 # main
